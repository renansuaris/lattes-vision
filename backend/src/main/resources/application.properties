spring.application.name=LattesVision

spring.datasource.url=jdbc:postgresql://localhost:5432/lattes_db
spring.datasource.username=admin
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Em um banco novo, a base Qualis e importada uma unica vez automaticamente.
qualis.import.enabled=true
qualis.import.file=data/qualis/raw/qualis_periodicos_2021_2024_oficial.xlsx
